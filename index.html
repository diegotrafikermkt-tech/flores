<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Flores amarillas</title>
  <meta name="description" content="Un jardín de flores amarillas sembrado para ti.">
  <meta name="theme-color" content="#ffe9b8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="loading">
  <canvas id="garden" role="img" aria-label="Un jardín de flores amarillas que se mueven con el viento. Toca el suelo para sembrar una flor."></canvas>
  <div id="floats" aria-hidden="true"></div>

  <!-- Pantalla de bienvenida -->
  <section id="intro" class="intro" aria-labelledby="introTitle">
    <div class="intro__card">
      <svg class="intro__emblem" viewBox="-50 -50 100 100" aria-hidden="true">
        <g id="emblemPetals"></g>
        <circle r="13" fill="#6b3f12"/>
        <circle r="8" fill="#4a2b0b"/>
      </svg>
      <p class="intro__kicker">Un jardín sembrado para</p>
      <h1 id="introTitle" class="intro__title"><span id="introFor">ti</span></h1>
      <p class="intro__sub">Flores amarillas, para que nunca te falte luz.</p>
      <button id="enter" class="btn btn--primary" type="button">Entrar al jardín</button>
    </div>
    <!-- Contraseña: solo aparece si el contenido publicado está protegido -->
    <form id="gate" class="gate" hidden>
      <svg class="intro__emblem" viewBox="-50 -50 100 100" aria-hidden="true">
        <g id="gatePetals"></g>
        <circle r="13" fill="#6b3f12"/>
        <circle r="8" fill="#4a2b0b"/>
      </svg>
      <h1 class="gate__title">Este jardín es privado</h1>
      <label class="gate__field">
        <span id="gateLabel">Escribe nuestra fecha de aniversario</span>
        <input id="gateInput" type="password" autocomplete="off" placeholder="DD/MM/AAAA" required>
      </label>
      <p id="gateMsg" class="form__msg" role="status"></p>
      <button class="btn btn--primary" type="submit">Entrar</button>
    </form>
  </section>

  <!-- Interfaz sobre el jardín -->
  <main id="hud" class="hud" inert>
    <header class="hud__top">
      <h2 id="hudNames" class="hud__names">Nosotros</h2>
      <div id="counter" class="counter" hidden>
        <p id="counterLabel" class="counter__label">Juntos desde hace</p>
        <div class="counter__cells" id="counterCells" role="timer" aria-live="off"></div>
      </div>
    </header>

    <p id="hint" class="hint">Toca el suelo para sembrar una flor · Las que brillan guardan un recuerdo</p>

    <nav class="dock" aria-label="Acciones">
      <button class="dock__btn" data-action="letter" type="button">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
        <span>Carta</span>
      </button>
      <button class="dock__btn" data-action="memories" type="button">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="m21 16-5-5-9 9"/></svg>
        <span>Recuerdos</span>
      </button>
      <button class="dock__btn" data-action="rain" type="button">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="2.4"/><circle cx="12" cy="5.2" r="2.8"/><circle cx="12" cy="18.8" r="2.8"/><circle cx="5.2" cy="12" r="2.8"/><circle cx="18.8" cy="12" r="2.8"/></svg>
        <span>Pétalos</span>
      </button>
      <button class="dock__btn" data-action="theme" type="button" aria-pressed="false">
        <svg class="ico ico--moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="ico ico--sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <span id="themeLabel">Noche</span>
      </button>
      <button class="dock__btn" data-action="music" type="button" aria-pressed="false" hidden>
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>
        <span>Música</span>
      </button>
      <button class="dock__btn" data-action="settings" type="button" hidden>
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2.2"/><circle cx="15" cy="17" r="2.2"/></svg>
        <span>Ajustes</span>
      </button>
    </nav>
  </main>

  <!-- Ventana emergente (carta, recuerdos, ajustes) -->
  <div id="modal" class="modal" aria-hidden="true" inert>
    <div class="modal__backdrop" data-close></div>
    <div class="modal__box" role="dialog" aria-modal="true">
      <button class="modal__close" type="button" data-close aria-label="Cerrar">×</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="garden.js"></script>
  <script src="app.js"></script>
</body>
</html>
